# R46: dataset_v5 全量Mare训练 + R43最佳模块组合
# train = 全量Mare(除test区) + 其他Scene, 无scene-level split
# val   = 随机5%训练tile (仅用于epoch选择，不报告)
# test  = 独立Mare区域 (与v5基准0.53对比)
# 用法: python scripts/train.py --config configs/R46.yaml

seed: 42

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: base
freeze_stages: 1

num_epochs: 100
max_steps: 0
batch_size: 2
accum_steps: 2
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: false
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 (Tversky, 与R43一致) ----
use_focal_loss: false
use_tversky_loss: true
tversky_alpha: 0.65
tversky_beta: 0.35

# ---- 数据增强 ----
use_scale_aug: true
scale_range: [0.9, 1.1]

# ---- Tile 采样 ----
use_tile_sampling: true
tile_sample_exp: 0.3

# ---- Early stopping (val=5%随机, patience适当放宽) ----
early_stop: true
patience: 20

# ---- 导出开关 ----
save_val_on_best: false
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 2.5, 4.0]
