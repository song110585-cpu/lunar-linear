# R25: R17 baseline + Focal Loss + Strip Pooling + 强正则
# 用法: python train.py --config configs/R25.yaml

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: small          # tiny / small / base
freeze_stages: 1

num_epochs: 60
max_steps: 0
batch_size: 4
accum_steps: 1
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.05         # R17: 0.01 → 0.05 压过拟合
grad_clip_norm: 1.0         # 梯度裁剪, 稳定训练

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: true     # R17: false → 专精长条线性构造
use_coord_attention: false
use_boundary_loss: false
use_dem_guided: true
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: true        # CE → Focal Loss, 降背景权重
focal_gamma: 2.0
focal_alpha: null           # null=使用 class_weights

# ---- 数据增强 ----
use_scale_aug: true         # 随机缩放 0.8x~1.2x
scale_range: [0.8, 1.2]

# ---- Early stopping ----
early_stop: true
patience: 12

# ---- 导出开关 ----
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 1.8, 2.5]
