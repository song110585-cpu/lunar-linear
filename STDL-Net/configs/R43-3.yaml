# R43-3: R41 基线 + Tversky Loss — 中间值平衡
# v1 α=0.7/β=0.3: WR 0.618 Rille 0.590
# v2 α=0.65/β=0.35: WR 0.606 Rille 0.637
# v3 α=0.68/β=0.32: 取中, 两全
# 用法: python scripts/train.py --config configs/R43-3.yaml

seed: 42

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: base
freeze_stages: 1

num_epochs: 100
max_steps: 0
batch_size: 2
accum_steps: 2
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: false
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: false
use_tversky_loss: true
tversky_alpha: 0.68              # v1=0.7 / v2=0.65 → 取中间
tversky_beta: 0.32               # v1=0.3 / v2=0.35 → 取中间

# ---- 数据增强 ----
use_scale_aug: true
scale_range: [0.9, 1.1]

# ---- Tile 采样 ----
use_tile_sampling: true
tile_sample_exp: 0.3

# ---- Early stopping ----
early_stop: true
patience: 15

# ---- 导出开关 ----
save_val_on_best: true
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 1.8, 1.5]
