# R42: R41 + WR 继续收紧 + Rille 加强 + 更多epoch
# WR 0.7→0.5: 继续用 Recall 换 Precision, 冲 0.62
# Rille 1.5→1.8: 加强关注, 直接拉 IoU
# epochs 80→100: R41 best@64 仍在涨, 多20轮挤余量
# 用法: python scripts/train.py --config configs/R42.yaml

seed: 42

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: base
freeze_stages: 1

num_epochs: 100
max_steps: 0
batch_size: 2
accum_steps: 2
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: false
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: false

# ---- 数据增强 ----
use_scale_aug: true
scale_range: [0.9, 1.1]

# ---- Tile 采样 ----
use_tile_sampling: true
tile_sample_exp: 0.3

# ---- Early stopping ----
early_stop: true
patience: 8

# ---- 导出开关 ----
save_val_on_best: true
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 (R42 继续微调) ----
class_weights: [0.15, 0.5, 1.8, 1.8, 1.5]
