# R43: R41 基线 + Tversky Loss
# 用 Tversky 替代 Dice: α=0.7 重罚 FP, β=0.3 轻罚 FN → 直接提升 Precision
# 针对 WR 和 Rille 的假阳性问题, 比 class_weights 更精细
# 用法: python scripts/train.py --config configs/R43.yaml

seed: 42

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: base
freeze_stages: 1

num_epochs: 100
max_steps: 0
batch_size: 2
accum_steps: 2
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: false
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 (R43 用 Tversky) ----
use_focal_loss: false
use_tversky_loss: true
tversky_alpha: 0.7               # FP 惩罚重 → 抑制假阳性, 提升 Precision
tversky_beta: 0.3                # FN 惩罚轻 → 容忍漏检, 允许保守

# ---- 数据增强 ----
use_scale_aug: true
scale_range: [0.9, 1.1]

# ---- Tile 采样 ----
use_tile_sampling: true
tile_sample_exp: 0.3

# ---- Early stopping ----
early_stop: true
patience: 15

# ---- 导出开关 ----
save_val_on_best: true
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 1.8, 1.5]
