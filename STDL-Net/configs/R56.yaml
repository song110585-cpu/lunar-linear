# R56: 随机8:1:1划分 baseline (v5 small + CE + class_weights)
# 数据: datasetv5_random811 (train+test合并后随机8:1:1)
# 用法: python scripts/train.py --config configs/R56.yaml

seed: 42

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
img_size: 512
model_size: small
freeze_stages: 2

num_epochs: 80
max_steps: 0
batch_size: 4
accum_steps: 1
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 (纯净基线) ----
use_augment: true
use_copypaste: false
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: false
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: false
use_tversky_loss: false

# ---- 数据增强 ----
use_scale_aug: false

# ---- Tile 采样 (关闭, 纯净基线) ----
use_tile_sampling: false
tile_sample_exp: 0.3

# ---- Early stopping ----
early_stop: true
patience: 15

# ---- 导出开关 ----
save_val_on_best: true
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 (R48 默认) ----
class_weights: [0.15, 1.0, 1.3, 1.8, 1.5]
