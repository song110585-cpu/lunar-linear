# R35: R34 抗过拟合基线 + Local CNN 双分支
# Local CNN: SwinV2 Stage2/3 并行 3×3 Conv 分支, 保留细线几何细节
# 预期: 提升 Fault/Wrinkle Ridge 的 Precision (减少背景纹理假阳性)
# 用法: python scripts/train.py --config configs/R35.yaml

seed: 42

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: small
freeze_stages: 1

num_epochs: 60
max_steps: 0
batch_size: 4
accum_steps: 1
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: true               # ← R35 加 Local CNN
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: false

# ---- 数据增强 ----
use_scale_aug: true
scale_range: [0.9, 1.1]

# ---- Tile 采样 ----
use_tile_sampling: true
tile_sample_exp: 0.3

# ---- Early stopping ----
early_stop: true
patience: 8

# ---- 导出开关 ----
save_val_on_best: true
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 1.8, 1.5]
