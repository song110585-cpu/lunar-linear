# R34: R33 + 抗过拟合
# 1. 采样温度降温: exponent 0.5→0.3, 降低高前景tile重复频率
# 2. 多尺度增强: use_scale_aug, 增加输入多样性
# 3. 早停收紧: patience 12→8, 避免过拟合后白跑
# 用法: python scripts/train.py --config configs/R34.yaml

seed: 42

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: small
freeze_stages: 1

num_epochs: 60
max_steps: 0
batch_size: 4
accum_steps: 1
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: false
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: false

# ---- 数据增强 (R34 新增) ----
use_scale_aug: true
scale_range: [0.9, 1.1]          # 温和缩放, ±10%

# ---- Tile 采样 (R34 降温) ----
use_tile_sampling: true
tile_sample_exp: 0.3             # R33=0.5, 越低越均匀 → 减少过拟合

# ---- Early stopping (R34 收紧) ----
early_stop: true
patience: 8                       # R33=12, 收紧避免过拟合期白跑

# ---- 导出开关 ----
save_val_on_best: true
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 1.8, 1.5]
