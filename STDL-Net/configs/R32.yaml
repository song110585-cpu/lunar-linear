# R32: R31 Base + Fault GT Dilation + FP Penalty
# 针对 Fault Precision 低的问题: GT膨胀宽容边界 + 惩罚假阳噪点
# 用法: python scripts/train.py --config configs/R32.yaml

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: base
freeze_stages: 1

num_epochs: 60
max_steps: 0
batch_size: 2              # base 模型显存大, 降低 batch
accum_steps: 2              # 等效 BS=4
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false
use_coord_attention: false
use_local_cnn: false
use_boundary_loss: false
use_dem_guided: false
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: false
use_fault_penalty: true         # Fault GT膨胀 + 假阳性惩罚
fault_dilate: 1                 # GT膨胀半径 (px), kernel=3
fault_fp_weight: 0.1            # 假阳性惩罚权重

# ---- 数据增强 ----
use_scale_aug: false

# ---- Tile 采样 ----
use_tile_sampling: true

# ---- Early stopping ----
early_stop: true
patience: 12

# ---- 导出开关 ----
save_val_on_best: true
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 1.8, 1.5]
