# R28: Dataset v6 + R26 Baseline + Boundary Supervision
# 用法: python scripts/train.py --config configs/R28.yaml

# ---- 核心参数 ----
num_classes: 5
in_channels: 5
model_size: small          # tiny / small / base
freeze_stages: 1

num_epochs: 60
max_steps: 0              # 每 epoch 步数限制 (0=全跑)
batch_size: 4
accum_steps: 1
learning_rate: 5.0e-5

# ---- 优化器正则 ----
weight_decay: 0.01
grad_clip_norm: 0           # 不裁剪

# ---- 模块开关 ----
use_augment: true
use_copypaste: true
copypaste_p: 0.5
use_strip_pooling: false    # 恢复 R26 基线
use_coord_attention: false
use_boundary_loss: true
boundary_loss_weight: 1.0
boundary_kernel_size: 3
use_dem_guided: false       # 继续关闭 DEM 融合
terrain_channels: 4

# ---- 损失函数 ----
use_focal_loss: false        # CE + Dice + 边界

# ---- 数据增强 ----
use_scale_aug: false

# ---- Early stopping ----
early_stop: true
patience: 12

# ---- 导出开关 ----
save_all_test_on_best: true
save_pred_mask_png: true
save_pred_vis_png: true

# ---- 类别权重 ----
class_weights: [0.15, 1.0, 1.3, 1.8, 1.5]
